<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Frontguard pre-release demo fixture</title>
  <desc id="description">No recorded CLI run is published yet. This is an illustrative gate card, not terminal output.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#background)"/>
  <rect x="72" y="66" width="282" height="42" rx="21" fill="#fbbf24"/>
  <text x="213" y="94" fill="#111827" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" text-anchor="middle">PRE-RELEASE FIXTURE</text>
  <text x="72" y="220" fill="#f9fafb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="54" font-weight="750">No recorded CLI run</text>
  <text x="72" y="286" fill="#f9fafb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="54" font-weight="750">is published yet.</text>
  <text x="72" y="370" fill="#c7d2fe" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25">This card replaces synthesized terminal output.</text>
  <text x="72" y="414" fill="#c7d2fe" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25">It is illustrative, not executable proof.</text>
  <rect x="72" y="500" width="1056" height="116" rx="16" fill="#0f172a" stroke="#4f46e5" stroke-width="2"/>
  <text x="104" y="548" fill="#a5b4fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">Evidence gate: .github/workflows/frontguard-example.yml</text>
  <text x="104" y="584" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">baseline pass + opt-in negative control required</text>
</svg>
