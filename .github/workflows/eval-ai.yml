name: AI eval

# Live eval of the default vision models (npm run eval:ai). Needs provider keys
# as repository secrets: FRONTGUARD_OPENAI_KEY, FRONTGUARD_ANTHROPIC_KEY,
# FRONTGUARD_GEMINI_KEY. A provider without a key is skipped with a notice.
# The mock eval (no keys) runs on every PR inside `npm test`.

on:
  schedule:
    # Monday 10:00 America/Los_Angeles (PDT, UTC-7)
    - cron: '0 17 * * 1'
  workflow_dispatch:
    inputs:
      provider:
        description: 'openai, anthropic, gemini, or all'
        required: false
        default: all
      model:
        description: 'Model override (blank = Frontguard default)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'packages/cli/src/diff/ai-*.ts'
      - 'packages/cli/src/diff/model-judge.ts'
      - 'packages/cli/scripts/eval/**'
      - 'packages/cli/scripts/eval-ai.ts'

permissions:
  contents: read

concurrency:
  group: eval-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: openai
            secret_var: FRONTGUARD_OPENAI_KEY
          - provider: anthropic
            secret_var: FRONTGUARD_ANTHROPIC_KEY
          - provider: gemini
            secret_var: FRONTGUARD_GEMINI_KEY
    env:
      PROVIDER: ${{ matrix.provider }}
      SECRET_VAR: ${{ matrix.secret_var }}
      SELECTED: ${{ github.event.inputs.provider || 'all' }}
      MODEL: ${{ github.event.inputs.model || '' }}
    steps:
      - name: Check provider key
        id: key
        env:
          PROVIDER_KEY: ${{ secrets[matrix.secret_var] }}
        run: |
          if [ "$SELECTED" != "all" ] && [ "$SELECTED" != "$PROVIDER" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$PROVIDER_KEY" ]; then
            echo "::notice title=AI eval skipped::$SECRET_VAR is not set as a repository secret; skipping $PROVIDER."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.run == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.key.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.key.outputs.run == 'true'
        run: npm ci
      - name: Install Playwright Chromium
        if: steps.key.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - name: Run eval
        if: steps.key.outputs.run == 'true'
        env:
          PROVIDER_KEY: ${{ secrets[matrix.secret_var] }}
        run: |
          export "${SECRET_VAR}=${PROVIDER_KEY}"
          unset PROVIDER_KEY
          args=(--provider "$PROVIDER" --fixes --out "$RUNNER_TEMP/eval-$PROVIDER.json")
          if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
          npm run eval:ai --workspace=packages/cli -- "${args[@]}" | tee "$RUNNER_TEMP/eval-$PROVIDER.txt"
      - name: Summary
        if: always() && steps.key.outputs.run == 'true'
        run: |
          {
            echo "### AI eval: $PROVIDER"
            echo '```'
            cat "$RUNNER_TEMP/eval-$PROVIDER.txt" 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.key.outputs.run == 'true'
        with:
          name: eval-ai-${{ matrix.provider }}
          path: ${{ runner.temp }}/eval-${{ matrix.provider }}.*
          retention-days: 90
