# These PR checks validate Action manifest structure and generated-file parity.
# They deliberately do not claim runtime smoke coverage: release acceptance must
# execute ravidsrk/frontguard@v0 from an external consumer repository after the
# pinned CLI version is published, with both unchanged and mutated fixtures.
#
# Local `uses: ./` only proves path resolution and previously masked published
# package failures, so it is intentionally absent here.
name: Action contract checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  root-action-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert repo-root action.yml exists (int-3 regression guard)
        run: test -f ./action.yml

      - name: Materialize and assert action manifest parity (COU-1, DEP-1)
        run: |
          node packages/cli/scripts/sync-root-action.mjs
          git diff --exit-code action.yml packages/cli/action.yml packages/cli/Dockerfile

      - name: Reject floating @frontguard/cli@latest (DEP-1)
        run: |
          if git grep -n '@frontguard/cli@latest' -- action.yml packages/cli/action.yml packages/cli/Dockerfile packages/cloud-api/src/daytona-runner.ts; then
            echo 'Floating @latest installs are not allowed — pin to repo VERSION'
            exit 1
          fi

      - name: Assert documented baseline-ref fetch is present (G-08)
        run: |
          set -euo pipefail
          FETCH='git fetch --no-tags origin +refs/heads/frontguard-baselines:refs/remotes/origin/frontguard-baselines'
          for f in action.yml packages/cli/action.yml packages/cli/action.template.yml \
            packages/cli/src/templates/github-actions.ts \
            integrations/github-app/src/github-api.ts; do
            grep -q "$FETCH" "$f" || { echo "missing documented fetch in $f" >&2; exit 1; }
          done

  subpath-action-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert sub-path action.yml exists
        run: test -f ./packages/cli/action.yml

      - name: Assert action run blocks do not interpolate inputs (SEC-1)
        run: |
          for f in action.yml packages/cli/action.yml; do
            if awk '/run: \|/{p=1} p && /\$\{\{ inputs\./{found=1; print FILENAME":"NR":"$0} /^ {4}- name:/{p=0}' "$f" | grep -q .; then
              awk '/run: \|/{p=1} p && /\$\{\{ inputs\./{print FILENAME":"NR":"$0} /^ {4}- name:/{p=0}' "$f"
              exit 1
            fi
          done

      - name: Assert all GITHUB_OUTPUT writes use random-delimiter heredoc (OPS-4)
        run: |
          for f in action.yml packages/cli/action.yml; do
            if grep -q '<<EOF' "$f"; then
              echo "Hardcoded EOF delimiter found in $f"
              exit 1
            fi
            if grep -E 'echo "(url|result|status|regressions)=' "$f"; then
              echo "Single-line GITHUB_OUTPUT write found in $f"
              exit 1
            fi
            if ! grep -q 'ghadelim_.*openssl rand -hex 8' "$f"; then
              echo "Missing random-delimiter helper in $f"
              exit 1
            fi
          done

  documented-baseline-ref-fetch:
    name: Documented CI path fetches the baseline ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prove default checkout misses a sibling ref and the documented fetch retrieves it
        run: |
          set -euo pipefail
          FIX=$(mktemp -d)
          git init --bare "$FIX/remote.git"
          git init -b main "$FIX/main"
          git -C "$FIX/main" config user.email "t15@example.com"
          git -C "$FIX/main" config user.name "T15"
          git -C "$FIX/main" config commit.gpgsign false
          echo hi > "$FIX/main/README"
          git -C "$FIX/main" add README
          git -C "$FIX/main" commit -m init
          git -C "$FIX/main" remote add origin "$FIX/remote.git"
          git -C "$FIX/main" push origin main

          git -C "$FIX/main" checkout --orphan frontguard-baselines
          git -C "$FIX/main" rm -rf .
          printf '{"ok":true}\n' > "$FIX/main/manifest.json"
          git -C "$FIX/main" add manifest.json
          git -C "$FIX/main" commit -m baseline
          git -C "$FIX/main" push origin frontguard-baselines

          git clone --depth=1 --single-branch --branch main "file://$FIX/remote.git" "$FIX/shallow"
          if git -C "$FIX/shallow" rev-parse --verify refs/remotes/origin/frontguard-baselines >/dev/null 2>&1; then
            echo "FAIL: depth-1 single-branch clone must not already have the baseline ref" >&2
            exit 1
          fi

          # Same command the generated workflow, composite Action, and GitHub App bootstrap emit.
          git -C "$FIX/shallow" fetch --no-tags origin +refs/heads/frontguard-baselines:refs/remotes/origin/frontguard-baselines
          CONTENT=$(git -C "$FIX/shallow" show origin/frontguard-baselines:manifest.json)
          echo "$CONTENT" | grep -q '"ok":true'
          echo "PASS: documented fetch retrieved the orphan baseline ref after fetch-depth: 1"
