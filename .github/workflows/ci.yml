name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Install Playwright browsers
        # The unit test suite for packages/cli reaches the discovery /
        # pipeline-unreachable paths which try to launch chromium. Install
        # browsers so the launch succeeds and the tests exercise the real
        # error branches (e.g. ECONNREFUSED on an unreachable base URL),
        # not "browser missing".
        run: npx playwright install --with-deps chromium
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    # The docker-build e2e does a cold, uncached Playwright base pull plus apt
    # install on every run, which is legitimately 10-25 minutes. Bound the job
    # so a genuinely hung build fails in 45 minutes instead of consuming the
    # 360-minute default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run CLI e2e tests
        run: npm run test:e2e --workspace=packages/cli

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Fails if VERSION drifted from any version-coupled file (package.json,
      # action.yml, Dockerfile, README, cli/mcp version constants).
      - run: npm run sync-version:check
      - name: Verify OpenAPI contract sync
        run: |
          node scripts/sync-openapi.mjs
          git diff --exit-code packages/cloud-api/src/openapi.json

  docs-links:
    # Guards apps/web docs-content.ts against broken internal /docs links
    # and non-canonical action refs. Dependency-free Node script — no build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check docs internal links + action refs
        run: node apps/web/scripts/check-doc-links.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Check bundle size
        # Two budgets, because there are two artifacts that matter and only one
        # of them used to be measured.
        #
        # Runtime deps are all externalized in tsup.config.ts, so both figures
        # are pure first-party code: a regression here means our own source
        # grew, never that a dependency leaked in.
        #
        # dist/index.js      — library entry, built from src/core/pipeline.ts.
        #   Budget history: 160KB -> 180KB in v0.2 (Docker render adapter IN-7,
        #   Storybook discovery IN-9) -> 200KB now. The entry graph is 36
        #   first-party modules with no vendored code; the previous ceiling was
        #   stale against deliberate feature growth, not a bloat regression.
        # dist/cli/index.js  — the actual published bin (bin.frontguard). This
        #   was previously UNGATED, so the artifact users install could grow
        #   without limit while CI guarded only the library entry.
        run: |
          check() {
            local path="$1" budget="$2" label="$3"
            local size
            size=$(wc -c < "$path")
            echo "$label: $size bytes (budget $budget)"
            if [ "$size" -gt "$budget" ]; then
              echo "::error::$label exceeds its budget: $size > $budget"
              return 1
            fi
          }
          status=0
          check packages/cli/dist/index.js     200000 "library entry" || status=1
          check packages/cli/dist/cli/index.js 360000 "published bin" || status=1
          exit $status

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: npm audit (prod, high+)
        run: npm audit --omit=dev --audit-level=high
