name: Weekly npm audit

on:
  schedule:
    # Monday 09:00 America/Los_Angeles (PDT, UTC-7)
    - cron: '0 16 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture production audit JSON
        run: npm audit --omit=dev --json > audit-current.json || true
      - name: Post weekly audit diff to issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AUDIT_LABEL: npm-audit-weekly
        with:
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            const label = process.env.AUDIT_LABEL;
            const title = 'Weekly npm audit (production tree)';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: label,
              per_page: 1,
            });

            let issueNumber;
            if (issues.length === 0) {
              const { data: created } = await github.rest.issues.create({
                owner,
                repo,
                title,
                labels: [label, 'dependencies'],
                body: [
                  'Automated weekly npm audit reports for the production dependency tree.',
                  '',
                  'Command: `npm audit --omit=dev --json`',
                  '',
                  'New reports are posted as comments below with a diff against the previous run.',
                ].join('\n'),
              });
              issueNumber = created.number;
            } else {
              issueNumber = issues[0].number;
            }

            let previousPath = null;
            // GitHub's issue comments API always returns comments in ascending order
            // (descending sort is unsupported). Paginate all comments and pick the
            // latest comment authored by `github-actions[bot]` that carries valid
            // audit metadata so public comments cannot spoof the baseline.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            const metadataPattern = /<!-- audit-metadata:([A-Za-z0-9+/=]+) -->/;
            const botComments = comments.filter(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' &&
                typeof comment.body === 'string' &&
                metadataPattern.test(comment.body),
            );

            if (botComments.length > 0) {
              const latest = botComments[botComments.length - 1];
              const match = latest.body.match(metadataPattern);
              if (match) {
                try {
                  const decoded = Buffer.from(match[1], 'base64').toString('utf8');
                  const parsed = JSON.parse(decoded);
                  if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
                    fs.writeFileSync('audit-previous.json', JSON.stringify(parsed));
                    previousPath = 'audit-previous.json';
                  }
                } catch (err) {
                  core.warning(`Failed to decode previous audit metadata: ${err}`);
                }
              }
            }

            const args = ['scripts/audit-weekly-report.mjs', 'audit-current.json'];
            if (previousPath) args.push(previousPath);

            const { execFileSync } = require('node:child_process');
            const report = execFileSync('node', args, { encoding: 'utf8' });

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: report,
            });
