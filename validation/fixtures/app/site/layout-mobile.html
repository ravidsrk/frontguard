<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>layout-mobile</title>
<style>
html, body { margin: 0; padding: 0; }
.panel { display: none; height: 100vh; }
@media (max-width: 500px) { .panel { display: block; background: #c4a000; } }
.note { font: 16px/1.4 sans-serif; padding: 12px; }
</style>
</head>
<body>
<div class="panel" data-mutate="layout-mobile"></div>
<p class="note">Mobile panel is display:none above 500px.</p>
</body>
</html>
