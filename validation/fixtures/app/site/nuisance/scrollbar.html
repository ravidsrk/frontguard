<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scrollbar</title>
<style>
html, body { margin: 0; padding: 0; }
html { overflow: hidden; scrollbar-color: #888888 #111; }
body { height: 220vh; background: #eee; }
::-webkit-scrollbar { width: 24px; }
::-webkit-scrollbar-thumb { background: #888888; }
</style>
</head>
<body>
<div data-mutate="scrollbar" style="height:200vh"></div>
</body>
</html>
